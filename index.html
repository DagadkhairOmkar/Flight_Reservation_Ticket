<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flight Reservation System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>✈️ Flight Reservation System</h1>
        <p>Book Your Flight Easily & Quickly</p>
    </header>


    <!-- Main Container -->
    <div class="container">

        <h2>Passenger Reservation</h2>

        <form id="reservationForm">

            <!-- Passenger Name -->
            <label>Passenger Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter passenger name"
                required
            >


            <!-- Passenger Age -->
            <label>Passenger Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter passenger age"
                min="1"
                max="120"
                required
            >


            <!-- Mobile Number -->
            <label>Passenger Mobile No.</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >


            <!-- Destination -->
            <label>Destination</label>

            <select id="destination" required>

                <option value="">
                    Select Destination
                </option>

                <option value="Mumbai">
                    Mumbai
                </option>

                <option value="Pune">
                    Pune
                </option>

                <option value="Delhi">
                    Delhi
                </option>

                <option value="Bangalore">
                    Bangalore
                </option>

                <option value="Hyderabad">
                    Hyderabad
                </option>

                <option value="Chennai">
                    Chennai
                </option>

            </select>


            <!-- Date -->
            <label>Journey Date</label>

            <input
                type="date"
                id="date"
                required
            >


            <!-- Time -->
            <label>Journey Time</label>

            <input
                type="time"
                id="time"
                required
            >


            <!-- Token -->
            <label>Token No.</label>

            <input
                type="text"
                id="token"
                value="Auto Generated"
                readonly
            >


            <!-- Submit -->
            <button type="submit">
                🎫 Book Ticket
            </button>

        </form>


        <!-- Confirmation -->
        <div id="confirmation" class="confirmation">

            <h2>✅ Booking Confirmed</h2>

            <p>
                <b>Passenger Name:</b>
                <span id="showName"></span>
            </p>

            <p>
                <b>Age:</b>
                <span id="showAge"></span>
            </p>

            <p>
                <b>Mobile No:</b>
                <span id="showMobile"></span>
            </p>

            <p>
                <b>Destination:</b>
                <span id="showDestination"></span>
            </p>

            <p>
                <b>Date:</b>
                <span id="showDate"></span>
            </p>

            <p>
                <b>Time:</b>
                <span id="showTime"></span>
            </p>

            <p>
                <b>Token No:</b>
                <span id="showToken"></span>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
